name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - target: fba_server
            image_suffix: server
          - target: fba_celery_worker
            image_suffix: celery-worker
          - target: fba_celery_beat
            image_suffix: celery-beat
          - target: fba_celery_flower
            image_suffix: celery-flower

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name
        run: echo "LOWER_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.LOWER_REPO }}-${{ matrix.service.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVER_TYPE=${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.DEPLOY_SSH_HOST_KEY || 'StrictHostKeyChecking no' }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload files to server via SCP
        run: |
          scp -P ${{ secrets.DEPLOY_PORT || '22' }} -o StrictHostKeyChecking=no \
            -r docker-compose.prod.yml deploy/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH || '/opt/fba' }}

      - name: Deploy to server via SSH
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT || '22' }} -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH || '/opt/fba' }}' \
            GITHUB_ACTOR='${{ github.actor }}' \
            GHCR_PAT='${{ secrets.GHCR_PAT }}' \
            GITHUB_REPOSITORY_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            'bash -s' << 'SSHEOF'
            set -e
            echo "=== 部署开始 ==="
            cd "$DEPLOY_PATH"
            if [ ! -f "deploy/backend/docker-compose/.env.server" ]; then
              echo "⚠️  请先创建 deploy/backend/docker-compose/.env.server 配置文件"
              exit 1
            fi
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            GITHUB_REPOSITORY_LOWER="$GITHUB_REPOSITORY_LOWER" docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "=== 部署完成 ==="
          SSHEOF
