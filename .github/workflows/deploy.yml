name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - target: fba_server
            image_suffix: server
          - target: fba_celery_worker
            image_suffix: celery-worker
          - target: fba_celery_beat
            image_suffix: celery-beat
          - target: fba_celery_flower
            image_suffix: celery-flower

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name
        run: echo "LOWER_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.LOWER_REPO }}-${{ matrix.service.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVER_TYPE=${{ matrix.service.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e

            # ── 初始化项目目录 ──────────────────────────────
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/fba' }}"
            REPO_URL="${{ secrets.DEPLOY_REPO_URL || 'https://gitee.com/Lireal-W/fastapi-best-architecture.git' }}"

            if [ ! -d "$DEPLOY_PATH" ]; then
              mkdir -p "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            # ── 拉取或更新项目代码 ──────────────────────────
            git config --global --add safe.directory "$DEPLOY_PATH" 2>/dev/null || true
            if [ -d ".git" ]; then
              git pull
            else
              # 首次部署：克隆仓库到当前目录
              git clone "$REPO_URL" .
            fi

            # ── 创建 .env 配置（如果不存在） ─────────────────
            if [ ! -f "deploy/backend/docker-compose/.env.server" ]; then
              mkdir -p deploy/backend/docker-compose
              cp backend/.env.example deploy/backend/docker-compose/.env.server
              echo "⚠️  请手动修改 deploy/backend/docker-compose/.env.server 中的配置"
            fi

            # ── 传递仓库信息到环境变量（必须小写） ────────────
            GITHUB_REPOSITORY_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export GITHUB_REPOSITORY_LOWER

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── 拉取最新镜像并重启服务 ──────────────────────
            GITHUB_REPOSITORY_LOWER="$GITHUB_REPOSITORY_LOWER" docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ── 清理旧镜像 ──────────────────────────────────
            docker image prune -f
