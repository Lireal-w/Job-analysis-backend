# ============================================================
# 生产环境 docker-compose（用于服务器部署）
# 镜像从 GitHub Container Registry 拉取，而非本地构建
# 使用方式：docker compose -f docker-compose.prod.yml up -d
# ============================================================

networks:
  fba_network:
    name: fba_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.10.0/24

volumes:
  fba_postgres:
    name: fba_postgres
  fba_redis:
    name: fba_redis
  fba_static:
    name: fba_static
  fba_static_upload:
    name: fba_static_upload
  fba_rabbitmq:
    name: fba_rabbitmq
  fba_prometheus_data:
    name: fba_prometheus_data

x-common-env: &common-env
  TZ: Asia/Shanghai

services:
  fba_server:
    image: ghcr.io/${GITHUB_REPOSITORY:-fastapi-best-architecture/fastapi-best-architecture}-server:latest
    pull_policy: always
    ports:
      - "${DOCKER_MAP_SERVER_PORT:-8001}:8001"
    container_name: fba_server
    restart: always
    environment:
      <<: *common-env
    depends_on:
      fba_postgres:
        condition: service_started
      fba_redis:
        condition: service_started
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - fba_static:/fba/backend/app/static
      - fba_static_upload:/fba/backend/static/upload
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_postgres:5432 -s fba_redis:6379 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_postgres:
    image: postgres:16
    ports:
      - "${DOCKER_MAP_POSTGRES_PORT:-5432}:5432"
    container_name: fba_postgres
    restart: always
    environment:
      POSTGRES_DB: fba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - fba_postgres:/var/lib/postgresql/data
    networks:
      - fba_network

  fba_redis:
    image: redis:latest
    ports:
      - "${DOCKER_MAP_REDIS_PORT:-6379}:6379"
    container_name: fba_redis
    restart: always
    environment:
      <<: *common-env
    networks:
      - fba_network

  fba_rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${DOCKER_MAP_RABBITMQ_PORT:-5672}:5672"
      - "${DOCKER_MAP_RABBITMQ_MGMT_PORT:-15672}:15672"
    container_name: fba_rabbitmq
    restart: always
    environment:
      <<: *common-env
    volumes:
      - fba_rabbitmq:/var/lib/rabbitmq
    networks:
      - fba_network

  fba_celery_worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-fastapi-best-architecture/fastapi-best-architecture}-celery-worker:latest
    pull_policy: always
    container_name: fba_celery_worker
    restart: always
    environment:
      <<: *common-env
    depends_on:
      fba_rabbitmq:
        condition: service_started
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_celery_beat:
    image: ghcr.io/${GITHUB_REPOSITORY:-fastapi-best-architecture/fastapi-best-architecture}-celery-beat:latest
    pull_policy: always
    container_name: fba_celery_beat
    restart: always
    environment:
      <<: *common-env
    depends_on:
      fba_rabbitmq:
        condition: service_started
      fba_celery_worker:
        condition: service_started
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_celery_flower:
    image: ghcr.io/${GITHUB_REPOSITORY:-fastapi-best-architecture/fastapi-best-architecture}-celery-flower:latest
    pull_policy: always
    ports:
      - "${DOCKER_MAP_CELERY_FLOWER_PORT:-8555}:8555"
    container_name: fba_celery_flower
    restart: always
    environment:
      <<: *common-env
    depends_on:
      fba_rabbitmq:
        condition: service_started
      fba_celery_worker:
        condition: service_started
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "${DOCKER_MAP_PROMETHEUS_PORT:-9090}:9090"
    container_name: fba_prometheus
    depends_on:
      - fba_loki
    volumes:
      - ./deploy/backend/grafana/fba_prometheus.yml:/workspace/fba_prometheus.yml
      - fba_prometheus_data:/prometheus
    networks:
      - fba_network
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --config.file=/workspace/fba_prometheus.yml

  fba_loki:
    image: grafana/loki:latest
    restart: always
    ports:
      - "${DOCKER_MAP_LOKI_PORT:-3100}:3100"
    container_name: fba_loki
    networks:
      - fba_network
    command: -config.file=/etc/loki/local-config.yaml

  fba_grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "${DOCKER_MAP_GRAFANA_PORT:-3000}:3000"
    container_name: fba_grafana
    depends_on:
      - fba_loki
      - fba_prometheus
    volumes:
      - ./deploy/backend/grafana/fba_grafana.ini:/etc/grafana/grafana.ini
      - ./deploy/backend/grafana/dashboards/fba_celery.json:/etc/grafana/dashboards/fba_celery.json
      - ./deploy/backend/grafana/dashboards/fba_server.json:/etc/grafana/dashboards/fba_server.json
      - ./deploy/backend/grafana/fba_dashboards.yml:/etc/grafana/provisioning/dashboards/fba_dashboards.yml
      - ./deploy/backend/grafana/fba_datasource.yml:/etc/grafana/provisioning/datasources/fba_datasource.yml
    networks:
      - fba_network
